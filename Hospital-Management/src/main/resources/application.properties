
#prefix and suffix configration
spring.mvc.view.prefix=/WEB-INF/layouts/
spring.mvc.view.suffix=.jsp

#Database Configrations
spring.datasource.url=jdbc:mysql://localhost:3306/hospital-mgt-spb
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.database-platform = org.hibernate.dialect.MySQL8Dialect
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto = update
#context Path 

server.servlet.context-path=/hospital-management
#AppURL: http://localhost:8085/hospital-management/



























	
#Mail Configration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=enter mail Id here...
spring.mail.password=enter password here...
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp

server.port=8085

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB






